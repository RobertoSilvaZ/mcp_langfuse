name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python syntax
        run: python -m py_compile server.py code_reader.py test_code_reader.py
      - name: Run code reader tests
        run: python -m unittest -v test_code_reader
      - name: Build container
        run: docker build -t langfuse-mcp:test .
