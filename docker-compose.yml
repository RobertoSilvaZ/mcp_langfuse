services:
  langfuse-mcp:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - type: bind
        source: ${SOURCE_CODE_PATH:?Set SOURCE_CODE_PATH to a local folder}
        target: /workspace
        read_only: true
    environment:
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://host.docker.internal:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?Set LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?Set LANGFUSE_SECRET_KEY}
      LANGFUSE_API_VERSION: ${LANGFUSE_API_VERSION:-v2}
      SOURCE_CODE_ROOT: /workspace
      MCP_PUBLIC_URL: https://${NGROK_DOMAIN:?Set NGROK_DOMAIN}/mcp
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:?Set AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?Set AUTH0_AUDIENCE}
      AUTH0_ALLOWED_SUBJECTS: ${AUTH0_ALLOWED_SUBJECTS:?Set AUTH0_ALLOWED_SUBJECTS}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    depends_on:
      - langfuse-mcp
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN}
    command:
      - http
      - --domain=${NGROK_DOMAIN:?Set NGROK_DOMAIN}
      - http://langfuse-mcp:8787
